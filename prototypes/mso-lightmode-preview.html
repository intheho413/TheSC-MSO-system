  #page-med-master #med-master-tab-contract .btn,
  #page-med-master #med-master-tab-docs .btn{width:100% !important;margin-bottom:6px}

  /* datalist 인풋 — 둥근 모서리 확인 */
  #page-master input[list],#page-med-master input[list]{border-radius:8px !important}
}

/* ═══════════════════════════════════════════════════════════════
   Phase 4 — 통합 정밀 조정 (사용자 피드백 반영)
   - 화장품 영업관리 탭 라벨 컴팩트화
   - 출고 수정 기간 선택 컴팩트
   - 수금 미수금 비중 탭 숨김
   - 기초관리 PC 전용 차단
   - 의료장비 동일 적용
═══════════════════════════════════════════════════════════════ */
@media (max-width:768px){
  /* === 1) 짤리는 부분 방지 — overflow 대응 강화 === */
  #page-dashboard,#page-stock,#page-med-report,#page-med-sales,
  #page-recv,#page-med-recv,#page-master,#page-med-master,
  #page-low-detail,#page-recv-detail,#page-sales-detail,
  #page-med-sales-detail,#page-med-recv-detail{overflow-x:hidden}
  #page-dashboard *,#page-stock *,#page-med-report *,#page-med-sales *,
  #page-recv *,#page-med-recv *{max-width:100%}

  /* === 2) 화장품 영업관리 탭 라벨 압축 + 균등 분배 === */
  #page-stock .tabs,#page-med-sales .tabs{display:flex !important;gap:4px !important;width:100%}
  #page-stock .tabs .tab,#page-med-sales .tabs .tab{flex:1 1 0 !important;min-width:0 !important;padding:10px 6px !important;font-size:12.5px !important;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* === 3) 출고 수정 — 기간 + 필터 컴팩트 + 리스트 메인 === */
  #stock-tab-edit .card:first-child,#med-sales-tab-edit .card:first-child{padding:10px 12px !important;margin-bottom:10px !important}
  #stock-tab-edit .form-row.cols-2,#med-sales-tab-edit .form-row.cols-2{grid-template-columns:1fr 1fr !important;gap:8px !important;margin-bottom:8px !important}
  #stock-tab-edit .form-row.cols-2 .form-group,#med-sales-tab-edit .form-row.cols-2 .form-group{margin-bottom:0 !important}
  #stock-tab-edit .form-label,#med-sales-tab-edit .form-label{font-size:11px !important;margin-bottom:3px !important}
  #stock-tab-edit .form-control,#med-sales-tab-edit .form-control{padding:8px 10px !important;font-size:14px !important}
  #stock-tab-edit input[type=date],#med-sales-tab-edit input[type=date]{font-size:13px !important}
  #stock-tab-edit > .card:first-child .btn,#med-sales-tab-edit > .card:first-child .btn{padding:9px !important;font-size:13px !important;width:100% !important;margin-top:4px}
  /* 출고 수정 — 안내문/액션버튼 압축 */
  #stock-tab-edit .info-box,#med-sales-tab-edit .info-box{font-size:11px !important;padding:7px 10px !important;line-height:1.4;margin-top:8px !important}
  #stock-tab-edit > .btn-group,#med-sales-tab-edit > .btn-group{margin-top:8px !important;margin-bottom:8px !important}
  /* 결과 리스트 강조 (높이 확보) */
  #stock-tab-edit > .tbl-wrap,#med-sales-tab-edit > .tbl-wrap{margin-top:6px !important;border:1px solid rgba(167,139,250,.2) !important;border-radius:8px !important;background:rgba(167,139,250,.03)}

  /* === 4) 수금 — 미수금 비중 탭 숨김 + 수금 등록 사이즈 정리 === */
  #page-recv .tabs button:nth-child(4){display:none !important}
  #page-recv .tabs button:nth-child(1){flex:2 1 0 !important}
  #page-recv .tabs button:nth-child(2){flex:1.5 1 0 !important}
  #page-recv .tabs button:nth-child(3){flex:1.5 1 0 !important}
  /* 수금 등록 폼 — 카드 + 날짜·금액 사이즈 */
  #recv-tab-pay .card{padding:14px 14px !important}
  #recv-tab-pay .form-row.cols-2{grid-template-columns:1fr 1fr !important;gap:10px !important}
  #recv-tab-pay .form-row.cols-2 .form-group{margin-bottom:0 !important}
  #recv-tab-pay #pay-date,#recv-tab-pay #pay-amount{font-size:15px !important;padding:9px 11px !important}
  #recv-tab-pay #pay-note{font-size:15px !important;padding:9px 11px !important}
  #recv-tab-pay .form-label{font-size:11.5px !important;margin-bottom:4px !important}
  #recv-tab-pay .btn-full{margin-top:12px !important;padding:12px !important;font-size:14px !important}

  /* === 5) 화장품 기초관리 — PC 전용 안내 === */
  #page-master::before{content:'기초 관리는 PC에서만 이용 가능합니다';display:block;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.3);color:#fde68a;padding:14px 16px;border-radius:10px;font-size:13px;font-weight:700;text-align:center;margin-bottom:12px;line-height:1.5;position:relative;z-index:5}
  /* 기초관리 입력 폼/표 흐림 + 비활성 */
  #page-master > *{opacity:.3;pointer-events:none}

  /* === 6) 의료장비 영업관리 동일 적용 === */
  #page-med-sales .tabs{display:flex !important;gap:4px !important;width:100%}
  #page-med-sales .tabs .tab{flex:1 1 0 !important;min-width:0 !important;padding:10px 6px !important;font-size:12.5px !important;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #page-med-sales .form-row{margin-bottom:8px !important}
  #page-med-sales .form-group{margin-bottom:8px !important}
  /* 의료장비 수금 비중 탭도 숨김 (있다면) */
  #page-med-recv .tabs button[onclick*="pie"]{display:none !important}

  /* === 7) 의료장비 기초관리 — PC 전용 안내 === */
  #page-med-master::before{content:'기초 관리는 PC에서만 이용 가능합니다';display:block;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.3);color:#fde68a;padding:14px 16px;border-radius:10px;font-size:13px;font-weight:700;text-align:center;margin-bottom:12px;line-height:1.5;position:relative;z-index:5}
  #page-med-master > *{opacity:.3;pointer-events:none}

  /* === 라이트 모드 PC 전용 안내 === */
  html.light #page-master::before,html.light #page-med-master::before{background:#fef3c7;border-color:#f59e0b;color:#92400e}

  /* === 공통 — 짤리는 텍스트/버튼 방지 === */
  .kpi-row,.kpi-row.three,.kpi-row.two{max-width:100% !important}
  .kpi-label,.kpi-sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .kpi-value{overflow:hidden;text-overflow:ellipsis}
  .card-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tab{overflow:hidden;text-overflow:ellipsis}

  /* === 의료장비 리포트 KPI 행 2번째 (kpi-row.two) === */
  #page-med-report .kpi-row.two{grid-template-columns:1fr 1fr !important;gap:8px !important}

  /* === 거래처 원장 액션 버튼 그룹 — 4개 버튼 2x2 wrap === */
  #recv-tab-ledger .btn-group{flex-wrap:wrap !important;gap:6px !important}
  #recv-tab-ledger .btn-group .btn{flex:1 1 calc(50% - 3px) !important;padding:9px 8px !important;font-size:12px !important}
  #recv-tab-ledger .selcount{flex-basis:100% !important;font-size:11.5px !important;margin:0 !important}

  /* === 입고 카트/출고 카트 — 카드 패딩 정리 === */
  #in-cart-section .card,#out-cart-section .card{padding:12px !important}
  #in-cart-section .btn-group,#out-cart-section .btn-group{flex-wrap:wrap !important;gap:6px}
  #in-cart-section .btn-group .btn,#out-cart-section .btn-group .btn{flex:1 1 calc(50% - 3px) !important;font-size:12.5px !important}
}

/* ═══════════════════════════════════════════════════════════════
   Phase 5 — 정밀 비율 조정 (사용자 피드백)
   - 리포트 엑셀 다운로드 카드 빈 공간 제거
   - 폼 라벨/인풋 컴팩트
   - 탭 클릭 영역 컴팩트
   - 모바일 화면 전체 활용
═══════════════════════════════════════════════════════════════ */
@media (max-width:768px){
  /* === 리포트 엑셀 다운로드 카드 빈 공간 제거 (column flex에서 title div가 flex:1로 공간 잡던 버그) === */
  #page-dashboard > .card:first-child,#page-med-report > .card:first-child{padding:12px 14px !important;gap:6px !important}
  #page-dashboard > .card:first-child > div:first-child,#page-med-report > .card:first-child > div:first-child{flex:0 0 auto !important;width:100%;min-width:0}
  #page-dashboard > .card:first-child .card-title,#page-med-report > .card:first-child .card-title{font-size:13.5px !important;margin-bottom:2px !important}
  #page-dashboard > .card:first-child .card-sub,#page-med-report > .card:first-child .card-sub{font-size:11px !important;margin-bottom:0 !important}
  #page-dashboard > .card:first-child .form-group,#page-med-report > .card:first-child .form-group{margin-bottom:0 !important;flex:0 0 auto !important;width:100%}
  #page-dashboard > .card:first-child .form-label,#page-med-report > .card:first-child .form-label{font-size:11px !important;margin-bottom:3px !important}
  #page-dashboard > .card:first-child input,#page-med-report > .card:first-child input{padding:9px 12px !important;font-size:14px !important}
  #page-dashboard > .card:first-child .btn,#page-med-report > .card:first-child .btn{margin-top:4px !important;padding:10px !important;font-size:13px !important}

  /* === 폼 라벨/인풋 더 컴팩트 (영업관리 + 수금 + 마스터) === */
  #page-stock .form-group,#page-med-sales .form-group,#page-recv .form-group,#page-master .form-group,#page-med-master .form-group{margin-bottom:8px !important}
  #page-stock .form-label,#page-med-sales .form-label,#page-recv .form-label,#page-master .form-label,#page-med-master .form-label{font-size:11.5px !important;margin-bottom:3px !important;font-weight:600}
  #page-stock .form-control,#page-med-sales .form-control,#page-recv .form-control,#page-master .form-control,#page-med-master .form-control{padding:9px 11px !important;box-sizing:border-box !important}
  #page-stock .card,#page-med-sales .card,#page-recv .card,#page-master .card,#page-med-master .card{padding:12px !important;margin-bottom:10px !important}
  #page-stock .divider,#page-med-sales .divider{margin:8px 0 !important}

  /* 품목 추가 등 섹션 헤더 (입고 폼 안 텍스트) */
  #page-stock div[style*="font-size:13px"]{font-size:12px !important;margin-bottom:6px !important}

  /* === 탭 클릭 영역 컴팩트 — 전 페이지 === */
  #page-stock .tabs,#page-med-sales .tabs,#page-recv .tabs,#page-med-recv .tabs,#page-master .tabs,#page-med-master .tabs{margin-bottom:8px !important;padding:0 !important;gap:3px !important}
  #page-stock .tab,#page-med-sales .tab,#page-recv .tab,#page-med-recv .tab,#page-master .tab,#page-med-master .tab{padding:7px 4px !important;font-size:12px !important;font-weight:700 !important;line-height:1.2 !important}

  /* === 수금 등록 — 2열 강제 (수금일/수금액 겹침 방지) === */
  #recv-tab-pay .form-row.cols-2{display:grid !important;grid-template-columns:1fr 1fr !important;gap:8px !important;margin-bottom:8px !important}
  #recv-tab-pay .form-row.cols-2 .form-group{margin-bottom:0 !important;width:100% !important;min-width:0}
  #recv-tab-pay .form-control{width:100% !important;max-width:100% !important;box-sizing:border-box !important;font-size:14px !important;padding:9px 11px !important}
  #recv-tab-pay #pay-date,#recv-tab-pay #pay-amount,#recv-tab-pay #pay-note{width:100% !important;max-width:100% !important}

  /* === KPI 컴팩트 (리포트 화면 짧게) === */
  #page-dashboard .kpi-row,#page-med-report .kpi-row{gap:6px !important;margin-bottom:8px !important}
  #page-dashboard .kpi,#page-med-report .kpi{padding:8px 11px !important}
  #page-dashboard .kpi-value,#page-med-report .kpi-value{font-size:16px !important;margin:3px 0 1px !important}
  #page-dashboard .kpi-label,#page-med-report .kpi-label{font-size:10.5px !important;letter-spacing:0}
  #page-dashboard .kpi-sub,#page-med-report .kpi-sub{font-size:9px !important}

  /* === 차트 카드 컴팩트 === */
  #page-dashboard .chart-card,#page-med-report .chart-card{padding:10px 12px !important;margin-bottom:8px !important}
  #page-dashboard .chart-card .card-title,#page-med-report .chart-card .card-title{font-size:12.5px !important;margin-bottom:4px !important}
  #page-dashboard [id^="chart-"],#page-med-report [id^="chart-"]{height:180px !important}

  /* === 카드 일반 — 마진 축소 === */
  .page > .card{margin-bottom:10px !important}

  /* === info-box 컴팩트 === */
  .info-box{font-size:11.5px !important;padding:8px 10px !important;line-height:1.45 !important;margin-bottom:8px !important}

  /* === 등록된 ~ 수정 섹션 헤더 컴팩트 === */
  div[style*="font-size:15px"]:not(.card-title){font-size:13px !important;margin:12px 0 8px !important;font-weight:700}

  /* === 페이지 자체 패딩 === */
  #page-dashboard,#page-stock,#page-med-report,#page-med-sales,#page-recv,#page-med-recv{padding-top:6px !important}

  /* === 리포트 KPI 2x2 grid 보장 === */
  #page-dashboard .kpi-row:not(.three):not(.two){grid-template-columns:1fr 1fr !important}
}

/* ═══════════════════════════════════════════════════════════════
   Phase 6 — Grid Cell Overflow 전역 픽스
   (날짜 박스 잘림, 수금일/수금액 겹침 등 공통 원인 해결)
═══════════════════════════════════════════════════════════════ */
@media (max-width:768px){
  /* 핵심: min-width:0 으로 grid cell이 input intrinsic width에 맞춰
     늘어나지 않도록 강제. 모든 input/select/textarea 적용. */
  .page input,.page select,.page textarea,
  .page input[type="date"],.page input[type="datetime-local"],
  .page input[type="number"],.page input[type="text"]{
    min-width:0 !important;
    max-width:100% !important;
    box-sizing:border-box !important;
  }
  /* form-row grid 셀의 min-width:0 (overflow 핵심) */
  .page .form-row{width:100% !important;box-sizing:border-box !important}
  .page .form-row > *{min-width:0 !important;box-sizing:border-box !important}
  .page .form-row.cols-2{display:grid !important;grid-template-columns:1fr 1fr !important;gap:8px !important;width:100% !important}
  .page .form-row.cols-2 > .form-group{margin-bottom:0 !important;width:auto !important;min-width:0 !important}
  /* form-control 강제 풀폭 + 인라인 width 무시 */
  .page .form-control{width:100% !important;max-width:100% !important;min-width:0 !important;box-sizing:border-box !important}

  /* === iOS 날짜 박스 — 컴팩트 패딩 (overflow 방지) === */
  .page input[type="date"],.page input[type="datetime-local"]{padding:9px 10px !important;font-size:14px !important;text-align:left !important}

  /* === 수금 등록 — 수금일/수금액 강제 분리 (겹침 차단) === */
  #recv-tab-pay .form-row{display:grid !important;width:100% !important}
  #recv-tab-pay .form-row.cols-2{grid-template-columns:1fr 1fr !important;gap:10px !important;margin-bottom:10px !important}
  #recv-tab-pay .form-row.cols-2 .form-group{min-width:0 !important;width:auto !important;margin-bottom:0 !important;overflow:hidden}
  #recv-tab-pay .form-row.cols-2 .form-control,
  #recv-tab-pay #pay-date,#recv-tab-pay #pay-amount{width:100% !important;max-width:100% !important;min-width:0 !important;font-size:14px !important;padding:9px 10px !important}
  #recv-tab-pay .form-row.cols-2 .form-label{font-size:11px !important;margin-bottom:3px !important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* === 리포트 엑셀 다운로드 — 날짜 박스 풀폭 + 1열 === */
  #page-dashboard > .card:first-child input[type="date"],
  #page-med-report > .card:first-child input[type="date"]{width:100% !important;max-width:100% !important;font-size:14px !important;padding:9px 10px !important}
  #page-dashboard > .card:first-child .form-row,
  #page-med-report > .card:first-child .form-row{display:grid !important;grid-template-columns:1fr !important;gap:8px !important}

  /* === 영업관리 출고 수정 — 기간 박스 컴팩트 === */
  #stock-tab-edit input[type="date"],#med-sales-tab-edit input[type="date"]{font-size:13px !important;padding:8px 9px !important}

  /* === 의료기기 페이지 동일 적용 (med-* 모든 페이지) === */
  #page-med-report .form-row,#page-med-sales .form-row,#page-med-recv .form-row,#page-med-master .form-row,
  #page-med-sales-detail .form-row,#page-med-recv-detail .form-row{width:100% !important;box-sizing:border-box !important}
  #page-med-report .form-row > *,#page-med-sales .form-row > *,#page-med-recv .form-row > *,#page-med-master .form-row > *{min-width:0 !important}
  #page-med-report .form-control,#page-med-sales .form-control,#page-med-recv .form-control,#page-med-master .form-control{width:100% !important;max-width:100% !important;min-width:0 !important;box-sizing:border-box !important}

  /* === 카드 자체 박스 정리 — overflow visible (date input 잘림 방지) === */
  .page .card{box-sizing:border-box !important;overflow:visible !important}
  .page .card .card-title{overflow:hidden;text-overflow:ellipsis}

  /* === select(드롭다운) min-width 0 === */
  .page select,.page select.form-control{min-width:0 !important;width:100% !important;max-width:100% !important;text-overflow:ellipsis;padding-right:32px !important}

  /* === 의료기기 수금 등록 (동일 구조) === */
  #med-recv-tab-pay .form-row.cols-2{display:grid !important;grid-template-columns:1fr 1fr !important;gap:10px !important;width:100%}
  #med-recv-tab-pay .form-row.cols-2 > .form-group{min-width:0 !important;margin-bottom:0 !important}

  /* === KPI 행 — 가로 overflow 차단 === */
  .kpi-row,.kpi-row.three,.kpi-row.two{width:100% !important;max-width:100% !important;box-sizing:border-box !important}
  .kpi{min-width:0 !important;box-sizing:border-box !important;overflow:hidden}
  .kpi .kpi-value{overflow:hidden;text-overflow:ellipsis}

  /* === 표 — wrapping 한도 === */
  .tbl-wrap{max-width:100% !important;box-sizing:border-box !important}
}

/* ═══════════════════════════════════════════════════════════════
   Phase 7 — 박스 잘림 현상 완전 해결
   - 카드 overflow:visible (기존 hidden이 input 끝 잘랐음)
   - 페이지 레벨만 overflow-x:hidden (가로 스크롤 차단)
   - 모든 input box-shadow/border 완전히 보이게
═══════════════════════════════════════════════════════════════ */
@media (max-width:768px){
  /* 페이지 레벨에서만 가로 스크롤 차단 */
  .page{overflow-x:hidden !important;overflow-y:visible !important;box-sizing:border-box !important}

  /* 카드 — overflow visible (내부 input border 보호) */
  .page .card{overflow:visible !important}

  /* 모든 input/select — 명시적 border-radius + visible 박스 */
  .page input,.page select,.page textarea{
    border-radius:8px !important;
    box-sizing:border-box !important;
    min-width:0 !important;
    width:100% !important;
    max-width:100% !important;
  }

  /* 날짜 input — iOS Safari 호환 + 박스 완전 표시 */
  .page input[type="date"],.page input[type="datetime-local"]{
    -webkit-appearance:none !important;
    appearance:none !important;
    border:1px solid rgba(255,255,255,.12) !important;
    background:rgba(255,255,255,.04) !important;
    color:#e9e7ff !important;
    padding:10px 12px !important;
    font-size:14px !important;
    text-align:left !important;
    border-radius:8px !important;
    box-sizing:border-box !important;
    height:auto !important;
    line-height:1.4 !important;
    display:block !important;
    width:100% !important;
  }
  html.light .page input[type="date"],html.light .page input[type="datetime-local"]{
    background:rgba(0,0,0,.02) !important;
    border-color:rgba(0,0,0,.12) !important;
    color:#1e293b !important;
  }

  /* 폼 그룹 — 내부 input이 가장자리에 닿지 않게 여유 */
  .page .form-group{box-sizing:border-box !important;overflow:visible !important}

  /* 카드 안 폼 영역 — 가장자리 1-2px 여유 */
  .page .card > .form-group,
  .page .card > .form-row{margin-left:0;margin-right:0;width:auto}

  /* 리포트 첫 카드 (엑셀 다운로드) 특별 처리 — 박스 완전 표시 */
  #page-dashboard > .card:first-child,#page-med-report > .card:first-child{
    padding:14px !important;
    overflow:visible !important;
  }
  #page-dashboard > .card:first-child .form-group,
  #page-med-report > .card:first-child .form-group{
    width:100% !important;
    box-sizing:border-box !important;
  }
  #page-dashboard > .card:first-child input[type="date"],
  #page-med-report > .card:first-child input[type="date"]{
    width:100% !important;
    box-sizing:border-box !important;
  }

  /* KPI 카드 — overflow visible로 그림자/border 보호 */
  .kpi{overflow:visible !important}

  /* 페이지 컨테이너 패딩 — 카드 가장자리 여유 확보 */
  #page-dashboard,#page-stock,#page-med-report,#page-med-sales,
  #page-recv,#page-med-recv{padding-left:10px !important;padding-right:10px !important}

  /* 수금 등록 카드도 overflow visible */
  #recv-tab-pay .card,#med-recv-tab-pay .card{overflow:visible !important;padding:14px !important}
  #recv-tab-pay .form-row.cols-2 .form-group{overflow:visible !important}
}
.mr-cmt .ctop{padding-right:72px}
/* 시간 영역은 액션 아이콘과 겹치지 않게 우측 마진 추가 */
.mr-cmt .time{margin-right:0}

/* 고정된 코멘트 */
.mr-cmt.pinned{background:linear-gradient(160deg,rgba(251,191,36,.1),rgba(251,191,36,.02));border-color:rgba(251,191,36,.3)}
.mr-cmt.pinned::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#fbbf24,#f59e0b);border-radius:11px 0 0 11px;box-shadow:0 0 8px #fbbf24}
.mr-cmt .body b{color:#fff;font-weight:700}
.mr-cmt .body .ment{color:#a5b4fc;font-weight:600}
.mr-cmt.event .body{color:#fdba74}
.mr-cmt.event.complete .body{color:#6ee7b7}
.mr-cmtinput{padding:12px 14px;border-top:1px solid rgba(255,255,255,.07);background:rgba(0,0,0,.2)}
.mr-cmtinput .ta{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:8px;color:#fff;padding:9px 11px;font-size:12.5px;font-family:inherit;resize:none;min-height:46px;margin-bottom:7px}
.mr-cmtinput .ta:focus{outline:none;border-color:rgba(167,139,250,.5)}
.mr-cmtinput .ta::placeholder{color:#475569}
.mr-cmtinput .send-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mr-cmtinput .hint{font-size:10.5px;color:#475569;font-weight:500}
.mr-cmtinput .send{background:linear-gradient(135deg,#a78bfa,#ec4899);border:none;color:#fff;padding:7px 16px;border-radius:7px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px rgba(167,139,250,.3)}
.mr-cmtinput .send:hover{filter:brightness(1.1)}

/* 중요 코멘트 등록 헤더 */
.mr-cmt-header{margin-bottom:9px}
.mr-cmt-title{font-size:10.5px;font-weight:800;color:#a5b4fc;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:7px;display:flex;align-items:center;gap:7px}
.mr-cmt-title::before{content:"";display:inline-block;width:3px;height:11px;border-radius:2px;background:linear-gradient(180deg,#a78bfa,#ec4899)}

.mr-cmt-cat{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);color:#94a3b8;padding:3px 9px;border-radius:5px;font-size:10.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
.mr-cmt-cat:hover{background:rgba(167,139,250,.14);color:#c4b5fd;border-color:rgba(167,139,250,.3)}
.mr-cmt-cat.on{background:linear-gradient(135deg,#a78bfa,#ec4899);color:#fff;border-color:transparent;box-shadow:0 4px 10px rgba(167,139,250,.3)}

/* 빠른 액션 / 다음 액션 / 실패 사유 / 인라인 편집 */
.mr-qa-bar{padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.02)}
.mr-qa-section{margin-bottom:10px}
.mr-qa-section:last-child{margin-bottom:0}
.mr-qa-title{font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:7px;display:flex;align-items:center;gap:6px}

.mr-qa-title.neg{color:#fca5a5}
.mr-qa-title.neu{color:#cbd5e1}
.mr-qa-title::before{content:"";display:inline-block;width:3px;height:10px;border-radius:2px}
.mr-qa-title.pos::before{background:linear-gradient(180deg,#34d399,#10b981);box-shadow:0 0 6px #34d399}
.mr-qa-title.neg::before{background:linear-gradient(180deg,#ef4444,#f87171);box-shadow:0 0 6px #ef4444}

/* ── Splash Overlay ── */
#splash-overlay{
  position:fixed;inset:0;z-index:999999 !important;
  display:flex !important;align-items:center;justify-content:center;
  background:
    radial-gradient(circle at 50% 50%,rgba(255,255,255,.045),transparent 50%),
    #060810;
}
#splash-overlay.sp-done{display:none !important}

/* 로고 블러 래퍼 — 포커스 인 */
.sp-blur-wrap{
  opacity:0;
  animation:sp-focus-in .58s cubic-bezier(.38,0,.18,1) forwards;
}
@keyframes sp-focus-in{
  from{opacity:.08;filter:blur(26px);transform:scale(1.18)}
  to  {opacity:1;  filter:blur(0);   transform:scale(1)}
}

/* 로고 이미지 — 흰 배경 제거 + 화이트 처리 */
.sp-logo-img{
  width:172px;height:172px;object-fit:contain;display:block;
  filter:
    url(#sp-rmw)
    saturate(0) brightness(200)
    drop-shadow(0 0 18px rgba(255,255,255,.7))
    drop-shadow(0 0 55px rgba(196,181,253,.45));
}

/* 퇴장 — .sp-hiding 시 */
#splash-overlay.sp-hiding .sp-blur-wrap{
  animation:sp-focus-out .5s cubic-bezier(.4,0,1,1) forwards;
}
@keyframes sp-focus-out{
  from{opacity:1;filter:blur(0);  transform:scale(1)}
  to  {opacity:0;filter:blur(10px);transform:scale(1.05)}
}
#splash-overlay.sp-hiding{
  animation:sp-bg-fade .25s .42s ease-in forwards;
}
@keyframes sp-bg-fade{to{opacity:0}}

/* ── Aurora Orb Background ── */
#aurora-bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
}
.aorb{
  position:absolute;border-radius:50%;
  filter:blur(90px);will-change:transform;
}
.aorb-1{
  width:520px;height:520px;
  background:radial-gradient(circle,rgba(124,58,237,.28),transparent 68%);
  top:-120px;left:-80px;
  animation:orb-float-1 22s ease-in-out infinite;
}
.aorb-2{
  width:600px;height:600px;
  background:radial-gradient(circle,rgba(59,130,246,.2),transparent 68%);
  top:-80px;right:-120px;
  animation:orb-float-2 28s ease-in-out infinite;animation-delay:-9s;
}
.aorb-3{
  width:480px;height:480px;
  background:radial-gradient(circle,rgba(34,211,238,.16),transparent 68%);
  bottom:-100px;right:30%;
  animation:orb-float-3 20s ease-in-out infinite;animation-delay:-5s;
}
@keyframes orb-float-1{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(60px,80px) scale(1.08)}
  66%{transform:translate(-40px,50px) scale(.94)}
}
@keyframes orb-float-2{
  0%,100%{transform:translate(0,0) scale(1)}
  40%{transform:translate(-70px,60px) scale(1.06)}
  70%{transform:translate(30px,-40px) scale(.96)}
}
@keyframes orb-float-3{
  0%,100%{transform:translate(0,0) scale(1)}
  35%{transform:translate(50px,-70px) scale(1.1)}
  68%{transform:translate(-30px,40px) scale(.92)}
}
html.light #aurora-bg{opacity:.35}

</style>
<style>body{background:#f8fafc!important;margin:0;padding:26px;font-family:'맑은 고딕',sans-serif}
.pv-note{max-width:1000px;margin:0 auto 16px;background:rgba(124,58,237,.08);border:1px solid rgba(124,58,237,.25);border-radius:12px;padding:12px 16px;font-size:12.5px;color:#334155}
.pv-wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.pv-h{font-size:12px;font-weight:800;color:#7c3aed;letter-spacing:1px;text-transform:uppercase;margin:6px 0 2px}</style></head>
<body>
<div class="pv-note"><b>라이트모드 가독성 미리보기</b> — MSO 리포트 주요 요소를 라이트모드로 렌더한 화면입니다. 글씨·입력창·칩이 흰 배경에서 또렷하게 보이는지 확인용.</div>
<div class="pv-wrap">
  <div class="pv-h">카테고리 카드</div>
  <div class="mr-catgrid">
    <div class="mr-cat c1"><div class="name">시너젯 <span class="cnt">7건</span></div><div class="stat"><span class="num">7</span><span class="lbl">건</span></div><div class="bar"><i style="width:70%"></i></div><div class="sub-stat"><span>진행 2</span><span>종결 5</span></div></div>
    <div class="mr-cat c4"><div class="name">텐써마 <span class="cnt">2건</span></div><div class="stat"><span class="num">2</span><span class="lbl">건</span></div><div class="bar"><i style="width:20%"></i></div><div class="sub-stat"><span>신규 2</span><span>종결 0</span></div></div>
    <div class="mr-cat c6"><div class="name">인텐스울트라 <span class="cnt">1건</span></div><div class="stat"><span class="num">1</span><span class="lbl">건</span></div><div class="bar"><i style="width:10%"></i></div><div class="sub-stat"><span>진행 0</span><span>종결 1</span></div></div>
  </div>
  <div class="pv-h">필터 · 검색</div>
  <div class="mr-toolbar">
    <div class="mr-filters"><button class="mr-filt on">전체 <span class="mr-badge">10</span></button><button class="mr-filt">진행중 <span class="mr-badge">3</span></button><button class="mr-filt">종결 <span class="mr-badge">5</span></button></div>
    <input class="mr-search" placeholder="거래처·제품 검색">
  </div>
  <div class="pv-h">안건 등록 폼</div>
  <div class="mr-form open" style="display:block">
    <div class="head-row"><div class="ttl">신규 안건 등록</div><button class="close">X</button></div>
    <div class="mr-fsec"><div class="stt">기본 정보</div>
      <div class="mr-g2">
        <div class="mr-fg"><label>거래처 <span class="req">*</span></label><input placeholder="거래처명 입력"></div>
        <div class="mr-fg"><label>제품 <span class="hint">선택</span></label><input placeholder="제품명"></div>
      </div>
    </div>
    <div class="mr-fsec"><div class="stt">분류 / 유형</div>
      <div class="mr-catpick"><button class="on k1"><span class="cdot"></span>화장품</button><button class="k2"><span class="cdot"></span>의료장비</button></div>
      <div class="mr-typepick" style="margin-top:10px"><button class="on">데모</button><button>제안/미팅</button></div>
    </div>
    <div class="mr-autotitle"><span class="lbl">자동 제목</span><span class="val">뷰티라운지 대치점 · 텐써마 제안/미팅</span></div>
    <div class="mr-fsec"><div class="stt">담당자</div>
      <div class="mr-mbpick"><span class="mr-mbchip on"><span class="avt a2">임</span>임준수</span><span class="mr-mbchip"><span class="avt a1">정</span>정인호</span></div>
    </div>
    <div class="mr-actions"><div class="left"><span class="pip"></span>작성 중</div><div class="right"><button class="mr-btn mr-btn-ghost">취소</button><button class="mr-btn mr-btn-primary">등록</button></div></div>
  </div>
  <div class="pv-h">PPT 다운로드 바</div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <span class="mr-ppt-range"><input value="2026-07-06" style="width:110px"> ~ <input value="2026-07-10" style="width:110px"></span>
    <button class="mr-ppt-preset">이번 주</button><button class="mr-ppt-preset">이번 달</button>
  </div>
</div>
</body></html>
